# Migrations for the `calls` table.
#
#   uv run alembic upgrade head                        apply
#   uv run alembic revision --autogenerate -m "..."    write the next one
#
# No `sqlalchemy.url` here on purpose: it would be a second place the database is named,
# and the real one carries a password. `migrations/env.py` reads `settings.database_url`
# instead, so the worker, the web process and Alembic all connect to whatever
# RECEPTIONIST_DATABASE_URL says and cannot disagree about which database is which.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/src
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
