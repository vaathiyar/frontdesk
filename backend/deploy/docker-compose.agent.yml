# Run ONLY the receptionist voice-agent worker — NOT LiveKit.
#
# This worker dials OUT to your self-hosted livekit-server over a WebSocket and registers
# as the "receptionist" agent (explicit dispatch). It opens no inbound ports, so this
# service publishes none.
#
# Prereqs (paths are relative to this file, i.e. under backend/):
#   ../.env   app + LiveKit + Gemini config: LIVEKIT_URL, LIVEKIT_API_KEY,
#             LIVEKIT_API_SECRET, GOOGLE_API_KEY, RECEPTIONIST_*.
#             Do NOT put GOOGLE_CREDENTIALS_FILE_PATH here — it is set below to the
#             in-container path of the mounted service-account JSON.
#   $SA_JSON  host path to the GCP service-account JSON (Cloud Speech-to-Text + TTS),
#             mounted read-only into the container.
#
# Run it (from backend/):
#   SA_JSON=/abs/path/to/service-account.json \
#     docker compose -f deploy/docker-compose.agent.yml up -d --build
#
services:
  receptionist-agent:
    build:
      # Build context is backend/ (this file lives in backend/deploy/).
      context: ..
      dockerfile: Dockerfile
    image: receptionist-agent
    env_file:
      - ../.env
    environment:
      # Override whatever GOOGLE_CREDENTIALS_FILE_PATH ../.env may carry with the
      # in-container path of the service-account JSON mounted just below.
      GOOGLE_CREDENTIALS_FILE_PATH: /secrets/sa.json
    volumes:
      # Mount the GCP service-account JSON read-only. SA_JSON must be set (compose errors
      # out with this message otherwise) so we never silently mount an empty path.
      - ${SA_JSON:?set SA_JSON to the host path of your GCP service-account JSON}:/secrets/sa.json:ro
    # A worker, not a server: no `ports:` — it only needs outbound network to livekit-server.
    restart: unless-stopped
