# The receptionist: a voice worker and the page its confirmation texts link to.
#
#   cd backend
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Both services run the same image and share one SQLite volume — the worker writes each
# finished call, the web process serves the signed link that was texted about it. They
# must also share RECEPTIONIST_LINK_SECRET, which comes from the environment for both.

services:
  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    image: receptionist
    command: ["uv", "run", "agent.py", "start"]
    env_file:
      - path: ../.env
        required: false
    volumes:
      - calls:/data
    # Dials out to LiveKit over a WebSocket; SIP media terminates at LiveKit, not here.
    # No inbound ports, no domain, no health check.
    restart: unless-stopped

  # Runs once, then exits: applies deploy/sip/numbers.json to LiveKit so each DID is
  # answered as the right business. Idempotent — `up` again and it reconciles.
  # Skip it with `--scale sip=0` if something else owns your SIP config.
  sip:
    image: receptionist
    depends_on: [worker]
    command: ["uv", "run", "python", "deploy/sip/provision.py"]
    env_file:
      - path: ../.env
        required: false
    restart: "no"

  web:
    image: receptionist
    depends_on: [worker]
    command: ["uv", "run", "serve.py"]
    env_file:
      - path: ../.env
        required: false
    environment:
      # 127.0.0.1 is the right default when run locally, but inside a container it makes
      # the server unreachable from outside it.
      HOST: 0.0.0.0
      PORT: 8000
    ports: ["8000:8000"]
    volumes:
      - calls:/data
    restart: unless-stopped

volumes:
  calls:
