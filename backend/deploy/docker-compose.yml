# The receptionist: a voice worker and the page its confirmation texts link to.
#
#   cd backend
#   SA_JSON=/abs/path/to/service-account.json \
#     docker compose -f deploy/docker-compose.yml up -d --build
#
# Both services run the same image and share one SQLite volume — the worker writes each
# finished call, the web process serves the signed link that was texted about it. They
# must also share RECEPTIONIST_LINK_SECRET, which comes from ../.env for both.
#
# Put LIVEKIT_*, GOOGLE_API_KEY, TELNYX_* and the RECEPTIONIST_* settings in backend/.env.
# Do NOT put GOOGLE_CREDENTIALS_FILE_PATH there: it is set below to the in-container
# mount path, which is not where the file lives on your host.
services:
  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    image: receptionist
    command: ["uv", "run", "agent.py", "start"]
    env_file: ../.env
    environment:
      GOOGLE_CREDENTIALS_FILE_PATH: /secrets/sa.json
    volumes:
      - ${SA_JSON:?set SA_JSON to the service-account JSON on your host}:/secrets/sa.json:ro
      - calls:/data
    # Dials out to LiveKit over a WebSocket; SIP media terminates at LiveKit, not here.
    # No inbound ports, no domain, no health check.
    restart: unless-stopped

  web:
    image: receptionist
    depends_on: [worker]
    command: ["uv", "run", "serve.py"]
    env_file: ../.env
    environment:
      # 127.0.0.1 is the right default when run locally, but inside a container it makes
      # the server unreachable from outside it.
      HOST: 0.0.0.0
      PORT: 8000
    ports: ["8000:8000"]
    volumes:
      - calls:/data
    restart: unless-stopped

volumes:
  calls:
