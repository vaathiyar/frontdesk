# The receptionist: a voice worker, and the JSON API the SPA reads.
#
#   cd backend
#   docker compose up -d --build
#
# All three services run the same image and point at the same CockroachDB cluster via
# RECEPTIONIST_DATABASE_URL — the worker writes each finished call, the web process
# serves it back. Nothing is stored in a container, so there is no volume.
#
# The SPA is NOT here. It is a separate origin, deployed separately; this image serves
# JSON and never markup. RECEPTIONIST_CORS_ORIGINS has to name the SPA's origin, and
# RECEPTIONIST_PUBLIC_BASE_URL has to point at it, since /c/{id} is its route, not ours.
#
# This file sits beside the Dockerfile, not under deploy/, and every path in it is relative
# to this directory. That is what makes it portable: Compose resolves `context:` and
# `env_file:` against the PROJECT DIRECTORY, which defaults here but which a platform sets
# for you — Coolify pins it to the configured base directory. A compose file one level down
# with `context: ..` resolves correctly on a laptop and one directory too high on Coolify,
# which fails the build with "open Dockerfile: no such file or directory".

services:
  worker:
    image: receptionist
    command: ["uv", "run", "agent.py", "start"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - path: .env
        required: false
    # Dials out to LiveKit over a WebSocket; SIP media terminates at LiveKit, not here.
    # No inbound ports, no domain, no health check.
    restart: unless-stopped

  # Runs once, then exits: brings the `calls` table up to head before anything writes
  # to it. Idempotent — `up` again and Alembic finds nothing to do. Both other services
  # wait on it completing, so a fresh cluster is usable without a manual step.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: receptionist
    command: ["uv", "run", "alembic", "upgrade", "head"]
    env_file:
      - path: .env
        required: false
    restart: "no"

  # Runs once, then exits: applies deploy/sip/numbers.json to LiveKit so each DID is
  # answered as the right business. Idempotent — `up` again and it reconciles.
  # Skip it with `--scale sip=0` if something else owns your SIP config.
  sip:
    image: receptionist
    depends_on: [worker]
    command: ["uv", "run", "python", "deploy/sip/provision.py"]
    env_file:
      - path: .env
        required: false
    restart: "no"

  web:
    image: receptionist
    depends_on:
      migrate:
        condition: service_completed_successfully
    # `fastapi run` reads the app from [tool.fastapi] in pyproject.toml and binds
    # 0.0.0.0:8000, which is what a container needs. (`fastapi dev` binds 127.0.0.1.)
    command: ["uv", "run", "fastapi", "run"]
    env_file:
      - path: .env
        required: false
    # `expose`, not `ports`: the container port is declared, but nothing is bound on the
    # host. A platform proxy reaches it over the internal network, and assigning a domain
    # is what publishes it. Binding the host here instead would sit outside that proxy —
    # no TLS, and it fails outright when anything else already holds the port
    # ("Bind for 0.0.0.0:8000 failed: port is already allocated").
    #
    # docker-compose.override.yaml publishes it for local use. Compose loads that file
    # automatically for a bare `docker compose up`, and ignores it whenever -f names this
    # file explicitly — which is how a platform invokes it. One file per audience, no flags.
    expose: ["8000"]
    restart: unless-stopped
