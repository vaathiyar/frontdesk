[project]
name = "ai-receptionist"
version = "0.1.0"
description = "AI receptionist — one LangGraph brain, swappable call profiles."
requires-python = ">=3.12"
dependencies = [
    # The brain: a LangGraph tool-calling loop over Gemini.
    "langgraph>=1.2.9",
    "langchain-core>=1.5.1",
    "langchain-google-genai>=4.3.2",
    # Voice: LiveKit drives VAD/STT/TTS and hands each turn to the graph.
    "livekit-agents>=1.6.7",
    "livekit-plugins-google>=1.6.7",
    "livekit-plugins-silero>=1.6.7",
    "livekit-plugins-langchain>=1.6.7",
    # Booking against a real Google Calendar.
    "google-api-python-client>=2.198.0",
    "google-auth>=2.56.2",
    # The web process. [standard] brings the `fastapi` CLI and uvicorn, so there is no
    # launcher script — `fastapi run` reads the entrypoint from [tool.fastapi] below.
    "fastapi[standard]>=0.115",
    # Where finished calls live: CockroachDB, over SQLAlchemy.
    #
    # psycopg 3 rather than asyncpg because it is BOTH sync and async, so one driver
    # serves the app's async engine and Alembic's sync one; asyncpg would have meant
    # psycopg2 alongside it. sqlalchemy-cockroachdb is never imported — SQLAlchemy loads
    # it from the `cockroachdb+psycopg://` URL scheme — but a plain `postgresql://` URL
    # skips it, and Alembic then fails on CockroachDB's introspection quirks.
    "sqlalchemy[asyncio]>=2.0",
    "sqlalchemy-cockroachdb>=2.0.4",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    # Telnyx is one POST; no vendor SDK.
    "httpx>=0.28",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dateutil>=2.9",
    "python-dotenv>=1.2",
]

# Dev tooling as a PEP 735 group — installed by `uv sync`, excluded by the Docker
# build's `uv sync --no-dev`.
[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-python-dateutil>=2.9",
]

# So `fastapi run` / `fastapi dev` need no arguments, here or in docker-compose.
[tool.fastapi]
entrypoint = "receptionist.api.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/receptionist"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# e2e tests call the live Gemini API; keep them out of the default offline run.
# Run them with: uv run pytest -m e2e -s
addopts = ["-m", "not e2e"]
markers = [
    "e2e: end-to-end test against the real Gemini API (needs GOOGLE_API_KEY)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

# Vendor boundaries treated as opaque rather than type-checked through.
# livekit ships py.typed but pulls in heavy transitive deps (numpy, onnxruntime) that we
# never touch directly; langgraph is deeply generic (ToolRuntime[...]); googleapiclient
# ships no stubs at all.
#
# Deliberately NOT listed, so they stay type-checked: langchain_core — its `@tool`
# decorator has to keep its real type or every tool silently becomes `Any`; and
# dateutil, which gets real stubs from types-python-dateutil, keeping the date/time
# resolver in services/when.py fully checked.
[[tool.mypy.overrides]]
module = [
    "livekit.*",
    "langgraph.*",
    "langchain_google_genai.*",
    "googleapiclient.*",
    "google.oauth2.*",
    "dotenv",
]
ignore_missing_imports = true
follow_imports = "skip"
